name: Deploy to Cloudflare Pages
# Runs after CI passes on main. Deploys the PREVIEW build (noindex, placeholders
# highlighted) to the Pages project's *.pages.dev address. It does not attach
# any custom domain or change DNS. Switch SITE_ENV to production only once
# `npm run launch-check` passes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_ENV: preview
      SITE_URL: https://seeksense.co
    steps:
      - name: Check Cloudflare credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (see docs/DEPLOY-CLOUDFLARE.md)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Create the Pages project if it does not exist
        run: npx --yes wrangler@4 pages project create seeksense --production-branch=main || echo "Project already exists"
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name=seeksense --branch=main --commit-dirty=true
      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          BASE=https://seeksense.pages.dev
          sleep 15
          check() { echo "checking: $1"; }
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' "$BASE/"); check "home returns 200 ($code)"; [ "$code" = 200 ]
          grep -q 'Help to make sense of what you are going through' /tmp/home.html; check "home content present"
          curl -sI "$BASE/" > /tmp/h.txt
          grep -qi "^content-security-policy: default-src 'self'" /tmp/h.txt; check "CSP header present"
          grep -qi '^x-robots-tag: noindex' /tmp/h.txt; check "preview is noindex"
          grep -q 'Disallow: /' <(curl -s "$BASE/robots.txt"); check "robots.txt blocks crawling"
          for p in /approach/ /services/ /find-support/ /contact/ /urgent-help/ /resources/ /about/ /privacy/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p"); check "$p -> $c"; [ "$c" = 200 ]
          done
          c=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/no-such-page/"); check "missing page -> $c"; [ "$c" = 404 ]
          c=$(curl -s -o /tmp/api.json -w '%{http_code}' -X POST "$BASE/api/enquiry" \
               -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{}'); check "enquiry endpoint -> $c $(cat /tmp/api.json)"
          [ "$c" = 503 ] || [ "$c" = 400 ]
          echo "Smoke test passed"
