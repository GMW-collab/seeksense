name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Compile the Cloudflare Pages Function
        run: npx --yes wrangler@4 pages functions build --outdir=/tmp/pages-functions
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Launch readiness (informational until verification is complete)
        run: npm run launch-check || true
